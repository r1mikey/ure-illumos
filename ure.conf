#
# ure.conf - Realtek RTL8152/8153/8156/8157 USB Ethernet driver configuration
#
# checksum
#   Set to 0 to disable hardware checksum offload (IPv4 header + TCP/UDP).
#   Default: 1 (enabled).  Requires unplumb/replumb to take effect.
#
# checksum=0;
#
# lso
#   Set to 0 to disable TCP segmentation offload (TSO/LSO).  TSO is
#   supported on RTL8153 and RTL8157 chips.  When enabled, the driver
#   offloads TCP segmentation to hardware, reducing CPU overhead for
#   large transfers.
#   Default: 1 (enabled).  Requires unplumb/replumb to take effect.
#
# lso=0;
